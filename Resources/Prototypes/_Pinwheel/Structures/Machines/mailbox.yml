## Teleporter
- type: entity
  id: MachineMailbox
  parent: BaseMachinePowered
  name: bluespace mailbox
  description: Periodically recieves mail addressed to someone on the station. The maintenance panel looks like it could be unscrewed and pried off, or bashed in.
  components:
  # visual
  - type: Sprite
    sprite: _Pinwheel/Structures/Machines/mail_teleporter.rsi
    snapCardinals: true
    layers:
    - state: base
    - state: panel
      map: [ "enum.SabotagableMachineVisualLayers.Cover" ]
    - state: tool
      visible: false
      map: [ "enum.SabotagableMachineVisualLayers.Tool" ]
    - state: flag-down
      map: [ "enum.DeliverySpawnerVisualLayers.Contents" ]
      visible: true
    - state: power
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SabotagableMachineVisuals.ShellState:
        enum.SabotagableMachineVisualLayers.Cover:
          0: { visible: false }
          1: { visible: true }
      enum.SabotagableMachineVisuals.ToolState:
        enum.SabotagableMachineVisualLayers.Tool:
          False: { visible: false }
          True: { visible: true }
      enum.DeliverySpawnerVisuals.Contents:
        enum.DeliverySpawnerVisualLayers.Contents:
          True: { state: flag-up }
          False: { state: flag-down }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  # audio
  - type: AmbientSound
    enabled: false
    range: 7
    sound:
      collection: MailboxAmbientSabotage
  # functional
  - type: Anchorable
    flags: [ Anchorable ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: DeliverySpawner
    table: !type:NestedSelector
      tableId: RandomDeliveryBasic
  - type: ContainerContainer
    containers:
      sabotage_container: !type:ContainerSlot
  - type: VoiceOverride
    nameOverride: Bluespace Mailbox
    speechVerbOverride: Robotic
  - type: SabotagableMachine
    sabotageLength: 1m
    soundInsert:
      collection: MailboxSabotageInsert
    soundRemove:
      collection: MailboxSabotageRemove
    soundComplete:
      collection: MailboxSabotageComplete
    soundAmbientSabotage:
      collection: MailboxAmbientSabotage
    toolInsertTime: 2s
    toolRemoveTime: 4s
    toolWhitelist:
      tags: [ MailboxHacker ]
  - type: Construction
    graph: MailboxSabotageGraph
    deconstructionTarget: null
    node: panel
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: bare

## Sound Collections
- type: soundCollection
  id: MailboxAmbientSabotage
  files:
  - /Audio/_Pinwheel/Structures/Machines/Mailbox/ambient_sabotage.ogg

- type: soundCollection
  id: MailboxSabotageInsert
  files:
  - /Audio/Effects/sparks1.ogg
  - /Audio/Effects/sparks2.ogg
  - /Audio/Effects/sparks3.ogg
  - /Audio/Effects/sparks4.ogg

- type: soundCollection
  id: MailboxSabotageRemove
  files:
  - /Audio/Effects/sparks1.ogg # TODO: placeholder

- type: soundCollection
  id: MailboxSabotageComplete
  files:
  - /Audio/Effects/kaching.ogg # TODO: placeholder

## Construction Graph
- type: constructionGraph
  id: MailboxSabotageGraph
  start: panel
  graph:
  - node: panel
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 1
    edges:
    - to: bare
      steps:
      - tool: Screwing
        doAfter: 5
      - tool: Prying
        doAfter: 1
  - node: bare
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 0
    - !type:RaiseEvent
      event: !type:SabotagableMachineOpenedEvent
      broadcast: false

## Macguffin
- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: MailboxHacker
  name: 1337 mail network autohacker
  description: A compact device designed for shunting into NanoTrasen bluespace mailboxes, using their hardware to authorize illicit transactions. Simply jam it anywhere on the circuit board and let it do its magic. The dream of script-kiddies sectorwide.
  components:
  - type: Sprite
    sprite: _Pinwheel/Devices/Sabotage/mailbox_hacker.rsi
    state: icon
  - type: Item
    shape:
    - 0,0,1,0
  - type: Tag
    tags: [ MailboxHacker ]

- type: Tag
  id: MailboxHacker
