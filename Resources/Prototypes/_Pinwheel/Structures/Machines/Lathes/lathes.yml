## Specifics
- type: entity
  parent: BaseMachineLathe
  id: MachineLatheBiogenerator
  name: biogenerator
  description: Converts plants into biomass, which can be used to construct useful items.
  components:
  - type: Sprite
    sprite: _Pinwheel/Structures/Machines/Lathes/biogenerator.rsi
  - type: Machine
    board: BoardLatheBiogenerator
  - type: ProduceMaterialExtractor
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Lathe
    unlitRunningState: null
    reagentOutputSlotId: beaker_slot
    staticPacks:
    - BioGenIngredientsStatic
    - BioGenMaterialsStatic

- type: entity
  parent: BaseMachineLathe
