## Specifics
- type: entity
  parent: BaseMachineLathe
  id: MachineLatheBiogenerator
  name: biogenerator
  description: Converts plants into biomass, which can be used to construct useful items.
  components:
  - type: Sprite
    sprite: Structures/Machines/biofabricator.rsi
  - type: Machine
    board: BiogeneratorMachineCircuitboard
  - type: ProduceMaterialExtractor
  - type: ItemSlots
    slots:
      beaker_slot:
        name: lathe-component-output-slot-beaker-name
        whitelist:
          components:
          - FitsInDispenser
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      beaker_slot: !type:ContainerSlot
  - type: Lathe
    reagentOutputSlotId: beaker_slot
    staticPacks:
    - BioGenIngredientsStatic
    - BioGenMaterialsStatic
  - type: EmagLatheRecipes
    emagStaticPacks:
    - BioGenEmagStatic
    - HostileCubesStatic

- type: entity
  parent: BaseMachineLathe
  id: MachineLatheCutter
  name: cutter machine
  description: This is a cutter. It cuts. Add variety to your station floor with eye-pleasing patterns! Don't stick your fingers in.
  components:
  - type: Sprite
    sprite: Structures/Machines/cuttermachine.rsi
  - type: Machine
    board: CutterMachineCircuitboard
  - type: Lathe
    producingSound: /Audio/Machines/cutter.ogg
    staticPacks:
    - FloorDarkTilesStatic
    - floorSteelTilesStatic
    - FloorWhiteTilesStatic
    - FloorMaintsTilesStatic
    - FloorIndustrialTilesStatic
    - FloorWoodTilesStatic
    - FloorConcreteTilesStatic
    - CircuitFloorsStatic
    - FloorMarbleTilesStatic
    - FloorShuttleTilesStatic
    - PlasticTilesStatic
    - PreciousTilesStatic

- type: entity
  parent: BaseMachineLathe
  id: MachineLatheRobotics
  name: exosuit fabricator
  description: Creates parts for robotics and other mechanical needs. # who wrote this shit?
  components:
  - type: Sprite
    sprite: Structures/Machines/exosuit_fabricator.rsi
    layers: # TODO: edit the rsi to have identical states to the parent so we don't have to redefine this
    - state: fab-idle
      map: [ "enum.LatheVisualLayers.IsRunning" ]
    - state: fab-load
      map: [ "enum.MaterialStorageVisualLayers.Inserting" ]
    - state: fab-o
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Machine
    board: ExosuitFabricatorMachineCircuitboard
  - type: Lathe
    idleState: fab-idle
    runningState: fab-active
    staticPacks:
    - RoboticsStatic
    - BorgModulesStatic
    - BorgLimbsStatic
  - type: GuideHelp
    guides:
    - Robotics

