## Base
- type: entity
  abstract: true
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: BaseMachineLathe
  name: lathe
  description: sample text
  components:
  # visual
  - type: Sprite
    sprite: _Pinwheel/Structures/Machines/Lathes/uniform.rsi # i bulldozed the generic lathes and this'll do
    snapCardinals: true
    layers:
    - state: base-idle
    - map: [ "enum.LatheVisualLayers.IsRunning" ]
    - state: unlit-idle
      shader: unshaded
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: inserting
      map: [ "enum.MaterialStorageVisualLayers.Inserting" ]
    - state: panel
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Appearance
  - type: WiresVisuals
  # UI
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: ActivatableUIRequiresPower
  # functional
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 190
        mask: [ MachineMask ]
        layer: [ MachineLayer ]
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: WiresPanel
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: PowerState
    idlePowerDraw: 150
    workingPowerDraw: 1000
  - type: OreSiloClient
  - type: MaterialStorage
    whitelist:
      tags:
        - Sheet
        - RawMaterial
        - Ingot
  - type: Lathe
    idleState: base-idle
    runningState: base-active
    unlitIdleState: unlit-idle
    unlitRunningState: unlit-active

