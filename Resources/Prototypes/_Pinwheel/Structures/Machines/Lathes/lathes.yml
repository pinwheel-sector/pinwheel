    - FloorWoodTilesStatic
    - FloorConcreteTilesStatic
    - CircuitFloorsStatic
    - FloorMarbleTilesStatic
    - FloorShuttleTilesStatic
    - PlasticTilesStatic
    - PreciousTilesStatic

