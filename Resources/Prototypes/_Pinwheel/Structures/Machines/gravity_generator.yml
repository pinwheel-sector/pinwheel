## Construction Graph
- type: constructionGraph
  id: GravityGeneratorSabotageGraph
  start: panel
  graph:
  - node: panel
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 2
    edges:
    - to: grate
      steps:
      - tool: Welding
        doAfter: 5
      - tool: Prying
        doAfter: 1
  - node: grate
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 1
    edges:
    - to: bare
      steps:
      - tool: Cutting
        doAfter: 3
  - node: bare
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 0
    - !type:RaiseEvent
      event: !type:SabotagableMachineOpenedEvent
      broadcast: false

## Macguffin
- type: entity
  parent: BaseItem
  id: GravityGeneratorHacker
  name: "reconfigured θ' reconfigurator"
  description: "A 'borrowed' NanoTrasen Theta Prime Gravitational Nucleus Directive Configurator 'touched up' by the Syndicate.\nRestructures the internal math on the gravity generator with the wrong numbers."
  components:
  - type: Sprite
    sprite: _Pinwheel/Devices/Sabotage/gravity_generator_hacker.rsi
    state: icon
  - type: Item
    size: Large
    shape:
    - 0,0,2,1
  - type: Tag
    tags: [ GravityGeneratorHacker ]

- type: Tag
  id: GravityGeneratorHacker
