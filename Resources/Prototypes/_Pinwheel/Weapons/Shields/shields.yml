- type: entity
  name: base shield
  parent: BaseItem
  id: BaseShield
  description: A shield!
  abstract: true
  components:
  - type: Sprite
    sprite: _Pinwheel/Weapons/Melee/Shields/security_riot.rsi
    state: icon
  - type: Item
    sprite: _Pinwheel/Weapons/Melee/Shields/security_riot.rsi
    size: Ginormous
  - type: Clothing
    sprite: _Pinwheel/Weapons/Melee/Shields/security_riot.rsi
    quickEquip: false
    equipWhileMoving: true
    equipDelay: 1s
    unequipDelay: 1s
    slots:
    - suitStorage
  - type: Blocking
    passiveBlockModifier:
      flatReductions:
        Blunt: 10
        Slash: 10
        Piercing: 10
        Heat: 10
  - type: Damageable
  - type: Injurable
    damageContainer: Shield
  - type: ExaminableDamage
    messages: ShieldMessages
  - type: StaticPrice
    price: 100

- type: entity
  abstract: true
  id: BaseShieldDestructible
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125 #This is probably enough damage before it breaks
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 2
            max: 2
          SheetGlass:
            min: 2
            max: 2

- type: entity
  name: base repairable shield
  parent: BaseShield
  id: BaseRepairableShield
  description: A repairable shield!
  abstract: true
  components:
  - type: Repairable # Negative values represent healing
    damage:
      types:
        Blunt: -20
        Slash: -20
        Piercing: -20
        Heat: -20
    fuelCost: 10 # 1/2 of a Welder for a full repair
    doAfterDelay: 5
    allowSelfRepair: false

#Security Shields

- type: entity
  name: riot shield
  parent: [ BaseRepairableShield, BaseShieldDestructible, BaseSecurityContraband ]
  id: RiotShield
  description: A large tower shield. Good for controlling crowds.
  components:
  - type: StaticPrice
    price: 90
  - type: Blocking
    passiveBlockModifier:
      flatReductions:
        Blunt: 15
        Slash: 15
        Piercing: 5
        Heat: 5

- type: entity
  name: laser shield
  parent: [ BaseRepairableShield, BaseShieldDestructible, BaseSecurityContraband ]
  id: RiotLaserShield
  description: A shield built for withstanding lasers, but not much else.
  components:
  - type: Sprite
    sprite: _Pinwheel/Weapons/Melee/Shields/security_laser.rsi
  - type: Item
    sprite: _Pinwheel/Weapons/Melee/Shields/security_laser.rsi
  - type: Clothing
    sprite: _Pinwheel/Weapons/Melee/Shields/security_laser.rsi
  - type: Blocking
    passiveBlockModifier:
      flatReductions:
        Blunt: 5
        Slash: 10
        Piercing: 5
        Heat: 20

- type: entity
  name: ballistic shield
  parent: [ BaseRepairableShield, BaseShieldDestructible, BaseSecurityContraband ]
  id: RiotBulletShield
  description: A shield built for protecting against ballistics, but not much else.
  components:
  - type: Sprite
    sprite: _Pinwheel/Weapons/Melee/Shields/security_ballistic.rsi
  - type: Item
    sprite: _Pinwheel/Weapons/Melee/Shields/security_ballistic.rsi
  - type: Clothing
    sprite: _Pinwheel/Weapons/Melee/Shields/security_ballistic.rsi
  - type: Blocking
    passiveBlockModifier:
      flatReductions:
        Blunt: 10
        Slash: 5
        Piercing: 20
        Heat: 5

#Craftable shields

- type: entity
  name: energy shield
  parent: [BaseItem, BaseSyndicateContraband]
  id: EnergyShield
  description: Exotic energy shield, when folded, can even fit in your pocket.
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/ebladeon.ogg
    soundDeactivate:
      path: /Audio/Weapons/ebladeoff.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/Weapons/ebladehum.ogg
  - type: ItemToggleSize
    activatedSize: Huge
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: Sprite
    sprite: _Pinwheel/Weapons/Melee/Shields/syndicate_energy.rsi
    layers:
      - state: eshield-icon
      - state: eshield-on
        color: "#FFFFFF"
        visible: false
        shader: unshaded
        map: [ "shield" ]
  - type: Item
    size: Small
    sprite: _Pinwheel/Weapons/Melee/Shields/syndicate_energy.rsi
    heldPrefix: eshield
  - type: UseDelay
    delay: 0.5
  - type: ToggleableVisuals
    spriteLayer: shield
    inhandVisuals:
      left:
        - state: inhand-left-shield
          shader: unshaded
      right:
        - state: inhand-right-shield
          shader: unshaded
  - type: PointLight
    netsync: false
    enabled: false
    radius: 1.5
    energy: 2
    color: blue
  - type: ItemTogglePointLight
  - type: Reflect
    reflectProb: 0.95
    reflects:
      - Energy
  - type: Blocking
    passiveBlockModifier:
      coefficients:
        Heat: 0.5
      flatReductions:
        Blunt: 5
        Piercing: 10
        Slash: 5
        Heat: 25
  - type: Appearance
  - type: Damageable
  - type: Injurable
    damageContainer: Shield
  - type: ExaminableDamage
    messages: EnergyShieldMessages
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          BrokenEnergyShield:
            min: 1
            max: 1
  - type: StaticPrice
    price: 350

- type: entity
  name: broken energy shield
  parent: BaseItem
  id: BrokenEnergyShield
  description: Something inside is burned out, it is no longer functional.
  components:
  - type: Sprite
    sprite: _Pinwheel/Weapons/Melee/Shields/syndicate_energy.rsi
    state: eshield-icon
  - type: Item
    sprite: _Pinwheel/Weapons/Melee/Shields/syndicate_energy.rsi
    size: Small
    heldPrefix: eshield
