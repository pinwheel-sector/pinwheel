- type: gameMap
  id: PinwheelElkridge
  mapName: 'Elkridge Depot'
  mapPath: /Maps/_Pinwheel/elkridge.yml
  minPlayers: 15
  maxPlayers: 45
  stations:
    Elkridge:
      stationProto: StandardNanotrasenStation
      components:
        - type: StationNameSetup
          mapNameTemplate: '{0} Elkridge Depot {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: 'DS'
        - type: StationEmergencyShuttle
          emergencyShuttlePath: /Maps/Shuttles/emergency_elkridge.yml
        - type: StationCargoShuttle
          path: /Maps/Shuttles/cargo_elkridge.yml
        - type: StationJobs
          availableJobs: # 32 jobs total w/o latejoins & interns, 7 latejoins, 8 interns
            #command (6)
            Captain: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            #service (6 - 8)
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 1 ]
            Clown: [ 1, 1 ]
            Janitor: [ 1, 2 ]
            Reporter: [ 1, 1 ]
            #engineering (3 - 4)
            StationEngineer: [ 3, 4 ]
            TechnicalAssistant: [ 2, 2 ] #intern, not counted
            #medical (5 - 6)
            MedicalDoctor: [ 2, 3 ]
            MedicalIntern: [ 2, 2 ] #intern, not counted
            Paramedic: [ 1, 1 ]
            #science (3 - 4)
            Scientist: [ 3, 4 ]
            ResearchAssistant: [ 2, 2 ] #intern, not counted
            #security (5 - 6)
            Warden: [ 1, 1 ]
            SecurityOfficer: [ 3, 4 ]
            Detective: [ 1, 1 ]
            SecurityCadet: [ 2, 2 ] #intern, not counted
            #supply (2 - 3)
            CargoTechnician: [ 2, 3 ]
            #civilian (inf)
            Passenger: [ -1, -1 ] #infinite, not counted
            #silicon (2)
            Borg: [ 2, 2 ]
