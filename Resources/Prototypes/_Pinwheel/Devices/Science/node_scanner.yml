- type: entity
  parent: BaseItem
  id: DeviceAlienScanner
  name: node scanner
  description: A handheld device capable of interpreting minute energy vibrations in an alien rock and visualizing them as nodes.
  components:
  - type: Sprite
    sprite: Objects/Specific/Xenoarchaeology/node_scanner.rsi
    state: icon
  - type: UserInterface
    interfaces:
      enum.AlienScannerUiKey.Key:
        type: AlienScannerBoundUserInterface
  - type: ActivatableUI
    key: enum.AlienScannerUiKey.Key
    singleUser: true
  - type: AlienScanner
    soundStart:
      collection: AlienScannerStart
    soundEnd:
      collection: AlienScannerEnd

- type: soundCollection
  id: AlienScannerStart
  files:
  - /Audio/_Pinwheel/AlienRock/scan_start.ogg

- type: soundCollection
  id: AlienScannerEnd
  files:
  - /Audio/_Pinwheel/AlienRock/scan_end.ogg
