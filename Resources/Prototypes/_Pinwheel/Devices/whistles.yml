## items
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseWhistle
  name: whistle
  description: A cheap plastic whistle, produces a sound when air is forced through it.
  components:
  - type: Item
    sprite: Objects/Fun/whistles.rsi
    size: Tiny
  - type: Sprite
    sprite: Objects/Fun/whistles.rsi
  - type: Clothing
    sprite: Objects/Fun/whistles.rsi
    quickEquip: false
    slots: neck
  - type: UseDelay
    delay: 3
  - type: Whistle
    distance: 3
    whistleSound:
      collection: PlasticWhistle

- type: entity
  parent: BaseWhistle
  id: Whistle
  components:
  - type: Sprite
    state: whistle

- type: entity
  parent: BaseWhistle
  id: SecurityWhistle
  description: A robust plastic whistle, produces a sound when air is forced through it. Useful for getting the attention of a crowd or punctuating your words.
  components:
  - type: Sprite
    state: sec
  - type: Clothing
    equippedPrefix: sec
  - type: Whistle
    distance: 5

- type: entity
  parent: [BaseWhistle, BaseMinorContraband]
  id: SyndicateWhistle
  name: trench whistle
  description: A whistle used by Syndicate commanders to draw attention. Avanti!
  components:
  - type: Sprite
    state: trench
  - type: Clothing
    equippedPrefix: trench
  - type: Whistle
    distance: 15
    whistleSound:
      collection: TrenchWhistle

# actions
- type: entity
  parent: BaseAction
  id: ActionWhistle
  name: Whistle
  description: Blow your whistle.
  components:
  - type: Action
    useDelay: 3
  - type: InstantAction
    event: !type:WhistleActionEvent {}

# sound collections
- type: soundCollection
  id: PlasticWhistle
  files:
    - /Audio/Items/Whistle/whistle_1.ogg
    - /Audio/Items/Whistle/whistle_2.ogg
    - /Audio/Items/Whistle/whistle_3.ogg
    - /Audio/Items/Whistle/whistle_4.ogg
    - /Audio/Items/Whistle/whistle_5.ogg
    - /Audio/Items/Whistle/whistle_6.ogg
    - /Audio/Items/Whistle/whistle_7.ogg

- type: soundCollection
  id: TrenchWhistle
  files:
    - /Audio/Items/Whistle/trench_whistle_1.ogg
    - /Audio/Items/Whistle/trench_whistle_2.ogg
    - /Audio/Items/Whistle/trench_whistle_3.ogg
