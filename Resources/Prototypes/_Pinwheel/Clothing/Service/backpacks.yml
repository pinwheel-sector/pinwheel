- type: entity
  parent: BaseClothingBackpack
  id: ClothingBackpackClown
  name: giggles von honkerton
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/clown.rsi
    state: icon
  - type: Storage
    storageOpenSound: &ClownOpen
      collection: BikeHorn
      params:
        variation: 0.125
    storageInsertSound: &ClownInsert
      collection: FootstepClown
      params:
        variation: 0.125

