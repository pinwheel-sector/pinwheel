    TraitorSabotageMailbox: 1
    TraitorStealAntiqueLaser: 1
    TraitorStealCaptainId: 1
    TraitorStealCaptainJetpack: 1
    TraitorStealCorgiMeat: 1
    TraitorStealDigiboard: 1
    TraitorStealEnergyMagnum: 1
    TraitorStealExperimentalHardsuit: 1
    TraitorStealHandheldMonitor: 1
    TraitorStealHandheldTeleporter: 1
    TraitorStealHypospray: 1
    TraitorStealKnuckleDusters: 1
    TraitorStealMagbootsAdvanced: 1
    TraitorStealNukeDisk: 1
    TraitorStealServerDiskCrewMonitor: 1
    TraitorStealServerDiskResearch: 1

### Bases
## Base of all
- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseTraitorObjective
  components:
  - type: Objective
    issuer: objective-issuer-syndicate
    unique: true
  - type: RoleRequirement
    roles: [ TraitorRole ]
  - type: ObjectiveLimit
    limit: 1

