# Cargo
- type: entity
  parent: BaseTraitorSabotageCargo
  id: TraitorSabotageAts
  name: Sabotage the Automated Trade Station
  description: Find the beacon in your uplink. Deploy it on the ATS and defend it whilst it breaches it's firewall.
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/hijack_beacon.rsi
      state: extraction_point
  - type: HijackTradeStationCondition

- type: entity
  parent: BaseTraitorSabotageCargo
  id: TraitorSabotageMailbox
  name: Sabotage Cargo's mailbox
  description: Find the hacking tool in your uplink and insert it into the machine. Make sure nobody pulls it out ahead of time.
  components:
  - type: Objective
    difficulty: 2 # it's really quiet and inconsequential
    icon:
      sprite: _Pinwheel/Devices/autohacker.rsi
      state: icon
  - type: SabotageMailboxCondition

