## Teleporter
- type: entity
  id: CargoMailbox
  parent: BaseMachinePowered
  name: bluespace mailbox
  description: Periodically recieves mail addressed to someone on the station. The maintenance panel looks like it could be unscrewed and pried off, or just bashed in.
  components:
  # visual
  - type: Sprite
    sprite: _Pinwheel/Structures/Machines/mail_teleporter.rsi
    snapCardinals: true
    layers:
    - state: base
    - state: panel
      map: [ "enum.SabotagableMachineVisualLayers.Cover" ]
    - state: tool
      visible: false
      map: [ "enum.SabotagableMachineVisualLayers.Tool" ]
    - state: flag-down
      map: [ "enum.DeliverySpawnerVisualLayers.Contents" ]
      visible: true
    - state: power
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SabotagableMachineVisuals.ShellState:
        enum.SabotagableMachineVisualLayers.Cover:
          0: { visible: false }
          1: { visible: true }
      enum.SabotagableMachineVisuals.ToolState:
        enum.SabotagableMachineVisualLayers.Tool:
          False: { visible: false }
          True: { visible: true }
      enum.DeliverySpawnerVisuals.Contents:
        enum.DeliverySpawnerVisualLayers.Contents:
          True: { state: flag-up }
          False: { state: flag-down }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  # functional
  - type: Anchorable
    flags: [ Anchorable ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: DeliverySpawner
    table: !type:NestedSelector
      tableId: RandomDeliveryBasic
  - type: ContainerContainer
    containers:
      sabotage_container: !type:ContainerSlot
  - type: VoiceOverride
    nameOverride: Bluespace Mailbox
    speechVerbOverride: Robotic
  - type: SabotagableMachine
    sabotageLength: 1m
    soundInsert:
      collection: MailboxSabotageInsert
    soundRemove:
      collection: MailboxSabotageRemove
    soundComplete:
      collection: MailboxSabotageComplete
    toolInsertTime: 2s
    toolRemoveTime: 4s
    toolWhitelist:
      tags: [ MailboxAutohacker ]
  - type: Construction
    graph: MailboxGraph
    deconstructionTarget: null
    node: panel
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:ChangeConstructionNodeBehavior
          node: bare

## Sound Collections
- type: soundCollection
  id: MailboxSabotageInsert
  files:
  - /Audio/Effects/sparks1.ogg
  - /Audio/Effects/sparks2.ogg
  - /Audio/Effects/sparks3.ogg
  - /Audio/Effects/sparks4.ogg

- type: soundCollection
  id: MailboxSabotageRemove
  files:
  - /Audio/Effects/sparks1.ogg # TODO: placeholder

- type: soundCollection
  id: MailboxSabotageComplete
  files:
  - /Audio/Effects/kaching.ogg # TODO: placeholder

## Construction Graph
- type: constructionGraph
  id: MailboxGraph
  start: panel
  graph:
  - node: panel
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 1
    edges:
    - to: bare
      steps:
      - tool: Screwing
        doAfter: 5
      - tool: Prying
        doAfter: 1
  - node: bare
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 0
    - !type:RaiseEvent
      event: !type:SabotagableMachineOpenedEvent
      broadcast: false

## Macguffin
- type: Tag
  id: MailboxAutohacker

- type: entity
  parent: BaseItem
  id: MailboxAutohacker
  name: 1337 mail network autohacker
  description: A compact device designed for shunting into NanoTrasen mail teleporters and wrecking cargo's day. Simply connect the pins to the exposed board in the teleporter and let the device do its magic for around two minutes, the dream of script-kiddies sectorwide.
  components:
  - type: Sprite
    sprite: _Pinwheel/Objects/Devices/autohacker.rsi
    state: icon
  - type: Item
    shape:
    - 0,0,1,0
  - type: Tag
    tags: [ MailboxAutohacker ]

