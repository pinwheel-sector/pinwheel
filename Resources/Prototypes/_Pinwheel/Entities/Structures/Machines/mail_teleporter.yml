## Teleporter
- type: entity
  id: CargoMailTeleporter
  parent: BaseMachinePowered
  name: mail teleporter
  description: Periodically teleports in mail to deliver across the station.
  components:
  # visual
  - type: Sprite
    sprite: Structures/mailbox.rsi
    snapCardinals: true
    layers:
    - state: icon
    - state: contents
      map: [ "enum.DeliverySpawnerVisualLayers.Contents" ]
      visible: false
    - state: unlit
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.DeliverySpawnerVisuals.Contents:
        enum.DeliverySpawnerVisualLayers.Contents:
          True: { visible: true }
          False: { visible: false }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  # functional
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: DeliverySpawner
    table: !type:NestedSelector
      tableId: RandomDeliveryBasic
  - type: ContainerContainer
    containers:
      sabotage_container: !type:ContainerSlot
  - type: SabotagableMachine
    insertSound:
      collection: MaleLaugh
    toolWhitelist:
      tags: [ MailTeleporterHacker ]
  - type: Construction
    graph: MailTeleporterGraph
    deconstructionTarget: null
    node: lid

## Construction Graph
- type: constructionGraph
  id: MailTeleporterGraph
  start: lid
  graph:
  - node: lid
    edges:
    - to: bare
      steps:
      - tool: Screwing
        doAfter: 5
      - tool: Prying
        doAfter: 1
  - node: bare
    actions:
    - !type:RaiseEvent
      event: !type:SabotagableMachineOpenedEvent
      broadcast: false

## Macguffin
- type: Tag
  id: MailTeleporterHacker

- type: entity
  parent: BaseItem
  id: LeetAutoHacker
  name: 1337 mail network autohacker
  description: A compact device designed for shunting into NanoTrasen mail teleporters and wrecking cargo's day. Simply connect the pins to the exposed board in the teleporter and let the device do its magic for around two minutes, the dream of script-kiddies sectorwide.
  components:
  - type: Sprite
    sprite: _Pinwheel/Objects/Devices/autohacker.rsi
    state: icon
  - type: Item
    shape:
    - 0,0,1,0
  - type: Tag
    tags: [ MailTeleporterHacker ]

