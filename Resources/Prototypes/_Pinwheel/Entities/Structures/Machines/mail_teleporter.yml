## Teleporter
- type: entity
  id: CargoMailTeleporter
  parent: BaseMachinePowered
  name: mail teleporter
  description: Periodically teleports in mail to deliver across the station.
  components:
  # visual
  - type: Sprite
    sprite: _Pinwheel/Structures/Machines/mail_teleporter.rsi
    snapCardinals: true
    layers:
    - state: base
    - state: panel
      map: [ "enum.SabotagableMachineVisualLayers.Cover" ]
    - state: tool
      visible: false
      map: [ "enum.SabotagableMachineVisualLayers.Tool" ]
    - state: flag-down
      map: [ "enum.DeliverySpawnerVisualLayers.Contents" ]
      visible: true
    - state: power
      shader: unshaded
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SabotagableMachineVisuals.ShellState:
        enum.SabotagableMachineVisualLayers.Cover:
          0: { visible: false }
          1: { visible: true }
      enum.SabotagableMachineVisuals.ToolState:
        enum.SabotagableMachineVisualLayers.Tool:
          False: { visible: false }
          True: { visible: true }
      enum.DeliverySpawnerVisuals.Contents:
        enum.DeliverySpawnerVisualLayers.Contents:
          True: { state: flag-up }
          False: { state: flag-down }
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  # functional
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.35,0.35,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: DeliverySpawner
    table: !type:NestedSelector
      tableId: RandomDeliveryBasic
  - type: ContainerContainer
    containers:
      sabotage_container: !type:ContainerSlot
  - type: VoiceOverride
    nameOverride: Mail Teleporter
    speechVerbOverride: Robotic
  - type: SabotagableMachine
    insertSound:
      collection: MaleLaugh
    removeSound:
      collection: MaleCry
    toolWhitelist:
      tags: [ MailTeleporterHacker ]
  - type: Construction
    graph: MailTeleporterGraph
    deconstructionTarget: null
    node: panel

## Construction Graph
- type: constructionGraph
  id: MailTeleporterGraph
  start: panel
  graph:
  - node: panel
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 1
    edges:
    - to: bare
      steps:
      - tool: Screwing
        doAfter: 5
      - tool: Prying
        doAfter: 1
  - node: bare
    actions:
    - !type:VisualizerDataInt
      key: "enum.SabotagableMachineVisuals.ShellState"
      data: 0
    - !type:RaiseEvent
      event: !type:SabotagableMachineOpenedEvent
      broadcast: false

## Macguffin
- type: Tag
  id: MailTeleporterHacker

- type: entity
  parent: BaseItem
  id: LeetAutoHacker
  name: 1337 mail network autohacker
  description: A compact device designed for shunting into NanoTrasen mail teleporters and wrecking cargo's day. Simply connect the pins to the exposed board in the teleporter and let the device do its magic for around two minutes, the dream of script-kiddies sectorwide.
  components:
  - type: Sprite
    sprite: _Pinwheel/Objects/Devices/autohacker.rsi
    state: icon
  - type: Item
    shape:
    - 0,0,1,0
  - type: Tag
    tags: [ MailTeleporterHacker ]

