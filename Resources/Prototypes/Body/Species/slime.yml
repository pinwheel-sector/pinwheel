# The species has been removed but the organs internal are used by simplemobs and whatnot so they stay - Pinwheel 

- type: entity
  parent: OrganBaseOrganic
  id: OrganSlimePerson
  abstract: true
  suffix: slime person

- type: entity
  id: OrganSlimePersonMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Slime ]

- type: entity
  parent: OrganSlimePerson
  id: OrganSlimePersonInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Slime/organs.rsi

- type: entity
  parent: [ OrganBaseBrain, OrganSlimePersonInternal, OrganSlimePersonMetabolizer ]
  id: OrganSlimePersonCore
  name: sentient slime core
  components:
  - type: SolutionManager
    solutions:
    - SolutionStomach
  - type: Stomach
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes: [ Slime ]
    stages: [ Digestion, Bloodstream, Metabolites ]

- type: entity
  parent: [ OrganBaseLungs, OrganSlimePersonInternal, OrganSlimePersonMetabolizer ]
  id: OrganSlimePersonLungs
  name: gas sacs
  components:
  - type: Lung
    alert: LowNitrogen
