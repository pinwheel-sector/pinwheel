# When adding new orbs, also add it to id: AllMiscToysTable
# Spherical objects of incredible* powers

- type: entity
  parent: BaseItem
  id: Magic9Ball
  name: magic 9 ball
  description: An endless source of wisdom... Now with a speaker included!
  components:
  - type: Sprite
    sprite: Objects/Fun/Balls/magic9ball.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: TriggerOnActivate
  - type: TriggerOnSignal
  - type: UseDelay
    delay: 5
  - type: UseDelayOnTrigger
  - type: UseDelayTriggerCondition
  - type: SpeakOnTrigger
    pack: Magic9Ball
  - type: Speech
    speechSounds: Pai
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 20
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ethanol
        Quantity: 30
  - type: Damageable
  - type: Injurable
    damageContainer: Inorganic
  - type: DamageOnLand
    damage:
      types:
        Blunt: 10
  - type: EmitSoundOnLand
    sound:
      collection: GlassBreak
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -4
      - !type:SpillBehavior
        solution: solution
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: PhysicalComposition
    materialComposition:
      Plastic: 50
