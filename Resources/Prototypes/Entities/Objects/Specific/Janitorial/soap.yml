# When adding new soaps, also add them to id: AllSoapsTable

- type: entity
  abstract: true
  parent: [SolutionSoapBase, BaseItem]
  id: BaseSoap
  name: soap
  components:
  - type: Tag
    tags:
    - Soap
  - type: Sprite
    sprite: Objects/Specific/Janitorial/soap.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 4
    fillBaseName: soap-
    changeColor: false
  - type: Appearance
  - type: Item
    sprite: Objects/Specific/Janitorial/soap.rsi
    storedRotation: -90
  - type: SolutionTransfer
    transferAmount: 10
    minTransferAmount: 1
    maxTransferAmount: 25
    canReceive: false
    canChangeTransferAmount: true
  - type: DrainableSolution
    solution: soap
  - type: DeleteOnSolutionEmpty
    solution: soap
  - type: FlavorProfile
    flavors:
    - clean
  - type: Edible
    solution: soap
  - type: BadFood
  - type: CleansForensics
  - type: Residue
    residueAdjective: residue-slippery

- type: entity
  abstract: true
  parent: [SolutionFood, SolutionSmall]
  id: SolutionSoapBase
  components:
  - type: Solution
    id: soap

- type: entity
  parent: BaseSoap
  id: Soap
  description: A cheap bar of soap. Doesn't smell.
  components:
  - type: Sprite
    layers:
    - state: soap-4
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Residue
    residueColor: residue-green
  - type: Solution
    solution:
      reagents:
      - ReagentId: SoapReagent
        Quantity: 60

- type: entity
  parent: Soap
  id: SoapNT
  description: A Nanotrasen brand bar of soap. Smells of plasma.
  components:
  - type: Sprite
    layers:
    - state: nt-4
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    fillBaseName: nt-
  - type: Item
    heldPrefix: nt
  - type: Solution
    solution:
      reagents:
      - ReagentId: SoapReagent
        Quantity: 55
      - ReagentId: Plasma
        Quantity: 5
  - type: Residue
    residueColor: residue-grey

- type: entity
  parent: Soap
  id: SoapDeluxe
  description: A deluxe Waffle Co. brand bar of soap. Smells of strawberries.
  components:
  - type: Sprite
    layers:
    - state: deluxe-4
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    fillBaseName: deluxe-
  - type: Item
    heldPrefix: deluxe
  - type: Residue
    residueColor: residue-brown

- type: entity
  parent: Soap
  id: SoapHomemade
  description: A homemade bar of soap. Smells of... well....
  components:
  - type: Sprite
    layers:
    - state: gibs-4
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    fillBaseName: gibs-
  - type: Item
    heldPrefix: gibs
  - type: FlavorProfile
    flavors:
      - clean
      - meaty
  - type: Residue
    residueColor: residue-red
