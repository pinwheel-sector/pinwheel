- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialPlastic, SolutionSmall, DrinkBase, DrinkBaseOpenable, DrinkVisualsAllFilled ]
  id: BaseSqueezeBottle
  components:
  - type: Openable
    sound:
      collection: packetOpenSounds
  - type: Sprite
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-6
      map: [ "enum.SolutionContainerLayers.Fill" ] # already has liquid, so no visible: false
    - state: icon-front
      map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: SolutionContainerVisuals
    maxFillLevels: 6
  - type: TrashOnSolutionEmpty
    solution: drink

- type: entity
  parent: [DrinkBaseMaterialGlass, DrinkBase]
  id: DrinkJarWhat
  name: jar of something
  description: You can't really tell what this is.
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/jar_what.rsi
  - type: FitsInDispenser
    solution: drink
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlass:
            min: 1
            max: 1
        transferForensics: true

# Mopwata
- type: weightedRandomFillSolution
  id: RandomFillMopwata
  fills:
  - quantity: 10
    weight: 5
    reagents:
    - Blood
    - CopperBlood
    - Slime
    - Vomit
  - quantity: 10
    weight: 4
    reagents:
    - Coffee
    - Tea
    - Cola
    - RootBeer
    - DrGibb
    - GrapeSoda
    - Starkist
    - SpaceUp
    - SpaceMountainWind
    - LemonLime
    - LemonLimeCranberry
    - PwrGame
  - quantity: 10
    weight: 3
    reagents:
    - Whiskey
    - Vodka
    - Beer
    - Ale
    - Rum
    - Tequila
    - Absinthe
  - quantity: 10
    weight: 1
    reagents:
    - SpaceDrugs
    - Mold
    - SpaceCleaner
    - MilkSpoiled
    - FourteenLoko

- type: entity
  parent: [DrinkVisualsAllFilled, DrinkBottleGlassSmallBaseFull]
  id: DrinkMopwataBottleRandom
  name: delicious mopwata
  description: A foggy brown bottle with a faded label depicting a mop. It comes full of murky... vintage.
  components:
  - type: Solution
    solution:
      reagents:
      - ReagentId: Mopwata
        Quantity: 50 # Extra space for the random fill
  - type: RandomFillSolution
    solution: drink
    weightedRandomId: RandomFillMopwata
  - type: Sprite
    sprite: Objects/Consumable/Drinks/mopwata.rsi
