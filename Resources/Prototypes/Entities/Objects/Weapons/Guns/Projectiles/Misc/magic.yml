- type: entity
  parent: BulletRocket
  id: ProjectileFireball
  categories: [ HideSpawnMenu ]
  name: fireball
  description: You better GITTAH WEIGH.
  components:
  - type: PointLight
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 10
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Explosive
    explosionType: Default
    maxIntensity: 40
    intensitySlope: 6
    totalIntensity: 200
    maxTileBreak: 0
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 0.35

- type: entity
  id: ProjectileAnomalyFireball
  categories: [ HideSpawnMenu ]
  name: fireball
  description: Hovering blob of flame.
  components:
  - type: TimedDespawn
    lifetime: 30
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 0.1
    totalIntensity: 0.3
    maxTileBreak: 0

- type: entity
  id: ProjectileIcicle
  parent: BaseBullet
  id: ProjectileIcicle
  categories: [ HideSpawnMenu ]
  name: icicle
  description: Brrrrr.
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/ice_anom.rsi
  - type: Projectile
    damage:
      types:
        Piercing: 20
        Cold: 20
