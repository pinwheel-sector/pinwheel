- type: entity
  parent: MarkerBase
  id: SpawnClownSpider
  name: clown spider spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - state: clown
      sprite: Mobs/Animals/clownspider.rsi
  - type: ConditionalSpawner
    prototypes:
    - MobClownSpider

