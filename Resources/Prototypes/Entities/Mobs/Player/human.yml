#Syndie
- type: entity
  parent: MobHuman
  id: MobHumanSyndicateAgentBase
  name: syndicate agent
  suffix: Human, Base
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: Loadout
    prototypes: [SyndicateOperativeGearExtremelyBasic]
    roleLoadout: [ RoleSurvivalSyndicate ]
  - type: RandomMetadata
    nameSegments:
    - NamesDeathCommandoFirst
    - NamesDeathCommandoLast
    nameFormat: name-format-standard
  - type: NpcFactionMember
    factions:
    - Syndicate

- type: entity
  parent: MobHumanSyndicateAgentBase
  id: MobHumanSyndicateAgentNukeops # Reinforcement exclusive to nukeops uplink
  suffix: Human, NukeOps
  components:
  - type: NukeOperative
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-operator
  - type: Loadout
    prototypes: [SyndicateOperativeGearFullNoUplink]

# Nuclear Operative
- type: entity
  categories: [ HideSpawnMenu ]
  name: Nuclear Operative
  parent: MobHuman
  id: MobHumanNukeOp
  components:
  - type: NukeOperative
  - type: RandomHumanoidAppearance
