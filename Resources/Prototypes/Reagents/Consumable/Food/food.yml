# End points - the eventual goal is that almost all foods and drinks metabolize into either these, or reagents that build up (e.g. theobromine, caffeine,... )
- type: reagent
  id: Nutriment #Anything that isn't better suited to vitamin, protein, or sugar. we aren't doing a super in-depth simulator.
  name: reagent-name-nutriment
  group: Foods
  desc: reagent-desc-nutriment
  physicalDesc: reagent-physical-desc-opaque
  flavor: nutriment
  color: "#24591F"
  metabolisms:
    Metabolites:
      effects:
      - !type:SatiateHunger
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 1.5
  - !type:PlantAdjustHealth
    amount: 0.75
  pricePerUnit: 2

- type: reagent
  id: Vitamin # sourced from plants - Pinwheel
  name: reagent-name-vitamin
  group: Foods
  desc: reagent-desc-vitamin
  physicalDesc: reagent-physical-desc-chalky
  flavor: vitamin
  color: "#D3D3D3"
  metabolisms:
    Metabolites: #This makes it not compete with medicines, a large bonus for something that can heal
      effects:
      # Pinwheel-stt - species standards
      - !type:SatiateHunger
      - !type:PopupMessage
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Carnivore, Moth ]
        type: local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-sick" ]
        probability: 0.5
      - !type:Vomit
        probability: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Carnivore, Moth ]
      # Pinwheel-end - species standards
  # Lets plants benefit too
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 0.5
  - !type:PlantAdjustHealth
    amount: 1.5
  pricePerUnit: 2.5

- type: reagent
  id: Protein  # sourced from meats - Pinwheel
  name: reagent-name-protein
  group: Foods
  desc: reagent-desc-protein
  physicalDesc: reagent-physical-desc-clumpy
  flavor: protein
  color: "#FFFFE5"
  metabolisms:
    Metabolites:
      effects:
      # Pinwheel-stt - species standards
      - !type:SatiateHunger
      - !type:PopupMessage
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Herbivore, Moth ]
        type: local
        visualType: MediumCaution
        messages: [ "generic-reagent-effect-sick" ]
        probability: 0.5
      - !type:Vomit
        probability: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Herbivore, Moth ]
      # Pinwheel-end - species standards
  pricePerUnit: 3

- type: reagent
  id: Sugar #Candy and grains
  name: reagent-name-sugar
  group: Foods
  desc: reagent-desc-sugar
  physicalDesc: reagent-physical-desc-sweet
  flavor: sweet
  color: white
  meltingPoint: 146.0
  metabolisms:
    Metabolites:
      effects:
      # Pinwheel-stt - species standards
      - !type:SatiateHunger
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Moth ]
      # Pinwheel-end - species standards
      - !type:SatiateHunger
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Moth ]
          inverted: true
        factor: 0.2
  plantMetabolism:
  - !type:PlantAdjustNutrition
    amount: 0.1
  - !type:PlantAdjustWeeds
    amount: 2
  - !type:PlantAdjustPests
    amount: 2
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/sugarglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 7
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false

- type: reagent
  id: PumpkinFlesh #Just so pumpkins spill orange stuff when smashed
  parent: Nutriment
  name: reagent-name-pumpkin-flesh
  desc: reagent-desc-pumpkin-flesh
  flavor: pumpkin
  color: "#fc9300"
